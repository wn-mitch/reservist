[workspace]
resolver = "3"
members = ["crates/reservist-core", "crates/reservist-content", "crates/reservist-cli", "crates/reservist-godot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
reservist-core = { path = "crates/reservist-core" }
reservist-content = { path = "crates/reservist-content" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
ryu-js = "1.0"
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std", "serde"] }
thiserror = "2"
csv = "1.4"
godot = { version = "=0.5.5", default-features = false, features = ["api-4-7"] }

[workspace.lints.clippy]
disallowed_types = "deny"
disallowed_methods = "deny"
