[[attribution]]
path = "/m2/chief"
category = "authorized_difference"
clause = "H Chief of staff; adopted D4; WP-18"
justification = "Named private cognition and dated officeholding replace the office-only representation. replacement_preserves_office_records_and_private_cognition proves the succession boundary."

[[attribution]]
path = "/m2/calendar"
category = "authorized_difference"
clause = "H Temporal cadence and Ordering and invalidation; adopted D3"
justification = "Loading and reading are paused; explicit advance resolves dated boundaries and reservations. loading_the_adopted_scenario_does_not_advance_its_clock, staff_admission_reserves_exact_dated_capacity_across_resume, and the Godot frame-delay cases replace the M1 next-consequential-event heuristic."

[[attribution]]
path = "/m2/commands"
category = "authorized_difference"
clause = "H Client boundary; WP-17"
justification = "Every command receives a witnessed, idempotent receipt. M2 command identity and resume tests prove duplicate delivery has no repeated effect and conflicting identities reject."

[[attribution]]
path = "/m2/folders"
category = "authorized_difference"
clause = "H Commit and submit; adopted P-01 and D2"
justification = "Ordinary choices remain drafts until whole-slate admission. penciling_is_not_admission_and_invalid_slates_have_no_partial_effects and a_new_agenda_instruction_changes_the_prospective_vote_without_rewriting_history prove atomic admission and prospective amendment."

[[attribution]]
path = "/m2/speaking"
category = "authorized_difference"
