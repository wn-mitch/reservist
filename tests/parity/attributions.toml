justification = "Marked authored inquiries commit when selected, independently of other pencils. speaking_commits_only_the_marked_inquiry_and_survives_closing_the_draft proves delayed delivery, capacity, duplicate safety, and preserved history."

[[attribution]]
path = "/m2/routing"
category = "authorized_difference"
clause = "H Evidence access and reporting friction; WP-21"
justification = "Metadata-only routing offers scoped joint work, sanitization, and authorized grants with real dated costs. M2 routing tests prove aggregate affordability, scope preservation, delayed delivery, and exact pending-work resume."

[[attribution]]
